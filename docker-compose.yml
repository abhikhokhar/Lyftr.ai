
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: lyftr-backend

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: sqlite:////data/lyftr.db
      ALLOWED_ORIGINS: http://localhost:3000

    volumes:
      - lyftr_data:/data

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    container_name: lyftr-frontend

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  lyftr_data:
